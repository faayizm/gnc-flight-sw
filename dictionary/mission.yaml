# =============================================================================
# MISSION DATA DICTIONARY  --  the single source of truth for this spacecraft.
#
# Everything downstream is GENERATED from this file by tools/gen.py:
#   * fsw/generated/*.hpp          C++17 packed structs, serializers, ids
#   * gnd/openc3/targets/SAT/...   OpenC3 COSMOS command & telemetry definitions
#   * docs/ICD.md                  the human-readable interface control document
#
# RULE: never hand-edit anything under fsw/generated/ or gnd/openc3/.../cmd_tlm/.
#       Edit this file, run `make gen`, commit the result.
#
# Wire format is CCSDS: big-endian ("network order"), no implicit padding.
# =============================================================================

mission:
  name: HYPERSAT
  # CCSDS Space Packet APIDs (11 bits). One per on-board application process.
  apids:
    TTC:  0x001      # telecommand & telemetry handler, also emits ST[01]/ST[05]
    ADCS: 0x002      # attitude determination & control
    EPS:  0x003      # electrical power
    GND:  0x00A      # ground segment (source APID of uplinked telecommands)
  # Space link: CCSDS TM/TC Space Data Link Protocols over a coded channel.
  # Both ends of the link are generated from these numbers.
  link:
    scid: 0x1A5              # spacecraft identifier (10 bits), in every frame header
    tm_frame_bytes: 223      # TM transfer frame = one RS(255,223) codeword, depth 1
    tc_max_frame_bytes: 1024 # largest TC transfer frame the spacecraft accepts (the CCSDS maximum)
    vc_realtime: 0           # TM virtual channel for live telemetry
    vc_playback: 1           # TM virtual channel for packets replayed from storage
    vc_idle: 7               # TM virtual channel for idle frames
    tc_vc: 0                 # TC virtual channel
    farm_window: 10          # FARM-1 sliding window width W (frames)
  # PUS time is CCSDS Unsegmented Code: 4 B coarse seconds + 2 B fine (1/65536 s)
  time:
    epoch: "2000-01-01T00:00:00Z"   # TAI-referenced mission epoch
    coarse_bytes: 4
    fine_bytes: 2

# -----------------------------------------------------------------------------
# Enumerations. Shared by flight code, ground displays and the ICD.
# -----------------------------------------------------------------------------
enums:
  SystemMode:
    desc: Top-level spacecraft mode owned by the mode manager.
    values:
      BOOT:     0
      SAFE:     1
      DETUMBLE: 2
      STANDBY:  3
      POINTING: 4

  AdcsEstState:
    desc: Convergence state of the attitude estimator.
    values:
      INVALID:     0
      INITIALISING: 1
      CONVERGING:  2
      CONVERGED:   3

  AdcsCtrlMode:
    desc: What the attitude controller is doing.
    values:
      IDLE:     0   # not OFF: YAML 1.1 reads a bare OFF as the boolean false
      DETUMBLE: 1
      STANDBY:  2
      POINTING: 3

  PowerState:
    desc: Coarse battery / power bus state used by mode arbitration.
    values:
      UNKNOWN:  0
      NOMINAL:  1
      LOW:      2
      CRITICAL: 3

  PowerRail:
    desc: Switched power rails, by bit number in rails_enabled. OBC, RX and SURVIVAL_HEATERS can never be switched off.
    values:
      OBC:              0
      RX:               1
      TX:               2
      ADCS:             3
      WHEELS:           4
      PAYLOAD:          5
      OPS_HEATERS:      6
      SURVIVAL_HEATERS: 7

  ModeRefusal:
    desc: Why the mode manager refused a ground mode request (MODE_REFUSED aux, low byte).
    values:
      NONE:           0
      RATES_HIGH:     1
      ATTITUDE_UNKNOWN: 2
      POWER:          3
      NOT_FROM_MODE:  4
      INVALID:        5

  SafeReason:
    desc: Why the spacecraft entered SAFE (SAFE_MODE_ENTERED aux).
    values:
      GROUND:         0
      POWER_CRITICAL: 1
      NO_CONTACT:     2

  Severity:
    desc: PUS ST[05] event severity, mapped to subtypes 1..4.
    values:
      INFO:     1
      LOW:      2
      MEDIUM:   3
      HIGH:     4

# -----------------------------------------------------------------------------
# Housekeeping telemetry. Each entry is one PUS ST[03,25] parameter report,
# identified on the wire by (APID, service=3, subtype=25, structure id).
# -----------------------------------------------------------------------------
telemetry:
  - name: SYS_HK
    sid: 1
    apid: TTC
    rate_hz: 1
    desc: Core system health, scheduler timing and link statistics.
    fields:
      - {name: uptime_s,         type: uint32, units: s,     desc: Seconds since boot}
      - {name: tick_count,       type: uint32, units: ticks, desc: Scheduler base ticks executed}
      - {name: mode,             type: uint8,  enum: SystemMode, desc: Current spacecraft mode}
      - {name: boot_count,       type: uint16, units: count, desc: Power-on / reset counter}
      - {name: cpu_load_pct,     type: uint8,  units: "%",   desc: Measured scheduler occupancy}
      - {name: sched_overruns,   type: uint16, units: count, desc: Rate-group deadline misses}
      - {name: tc_received,      type: uint32, units: count, desc: Telecommands accepted}
      - {name: tc_rejected,      type: uint32, units: count, desc: Telecommands rejected}
      - {name: tm_sent,          type: uint32, units: count, desc: Telemetry packets downlinked}
      - {name: link_up,          type: uint8,  units: bool,  desc: Ground link connected}
      - {name: events_logged,    type: uint32, units: count, desc: Events raised since boot}
      - {name: last_event_id,    type: uint16, units: id,    desc: Identifier of most recent event}
      - {name: tm_frames_sent,   type: uint32, units: count, desc: TM transfer frames transmitted}
      - {name: tc_frames_ok,     type: uint32, units: count, desc: TC transfer frames accepted}
      - {name: tc_frames_bad,    type: uint32, units: count, desc: TC transfer frames rejected (frame checks or FARM-1)}
      - {name: cltu_corrected,   type: uint32, units: count, desc: Uplink bit errors corrected by BCH}
      - {name: farm_vr,          type: uint8,  units: "-",   desc: FARM-1 V(R), the next expected frame sequence number}
      - {name: farm_lockout,     type: uint8,  units: bool,  desc: FARM-1 is in lockout and needs an Unlock}
      - {name: time_status,      type: uint8,  units: "-",   desc: PUS time reference status, 1 = correlated with the ground}
      - {name: sched_pending,    type: uint16, units: count, desc: Time-tagged telecommands waiting for release}
      - {name: sched_enabled,    type: uint8,  units: bool,  desc: Time-based release is enabled}
      - {name: store_packets,    type: uint32, units: count, desc: Packets held in the packet store}
      - {name: store_used_pct,   type: uint8,  units: "%",   desc: Packet store fill level}

  - name: ADCS_HK
    sid: 2
    apid: ADCS
    rate_hz: 1
    desc: Attitude determination and control state.
    fields:
      - {name: est_state,        type: uint8,   enum: AdcsEstState, desc: Estimator convergence state}
      - {name: ctrl_mode,        type: uint8,   enum: AdcsCtrlMode, desc: Attitude controller mode}
      - {name: q_est_0,          type: float32, units: "-",     desc: Estimated attitude quaternion scalar part}
      - {name: q_est_1,          type: float32, units: "-",     desc: Estimated attitude quaternion x}
      - {name: q_est_2,          type: float32, units: "-",     desc: Estimated attitude quaternion y}
      - {name: q_est_3,          type: float32, units: "-",     desc: Estimated attitude quaternion z}
      - {name: omega_x,          type: float32, units: rad/s,   desc: Bias-corrected body rate about X}
      - {name: omega_y,          type: float32, units: rad/s,   desc: Bias-corrected body rate about Y}
      - {name: omega_z,          type: float32, units: rad/s,   desc: Bias-corrected body rate about Z}
      - {name: gyro_bias_x,      type: float32, units: rad/s,   desc: Estimated gyro bias X}
      - {name: gyro_bias_y,      type: float32, units: rad/s,   desc: Estimated gyro bias Y}
      - {name: gyro_bias_z,      type: float32, units: rad/s,   desc: Estimated gyro bias Z}
      - {name: pointing_err_deg, type: float32, units: deg,     desc: Angle between body and reference pointing axis}
      - {name: rate_norm,        type: float32, units: deg/s,   desc: Magnitude of the body rate vector}
      - {name: sun_valid,        type: uint8,   units: bool,    desc: Sun sensor reference is usable}
      - {name: mag_valid,        type: uint8,   units: bool,    desc: Magnetometer reference is usable}
      - {name: eclipse,          type: uint8,   units: bool,    desc: Spacecraft is in Earth shadow}
      - {name: torque_cmd_x,     type: float32, units: N*m,     desc: Commanded control torque X}
      - {name: torque_cmd_y,     type: float32, units: N*m,     desc: Commanded control torque Y}
      - {name: torque_cmd_z,     type: float32, units: N*m,     desc: Commanded control torque Z}
      - {name: pos_eci_x,        type: float64, units: m,       desc: On-board estimated position ECI X}
      - {name: pos_eci_y,        type: float64, units: m,       desc: On-board estimated position ECI Y}
      - {name: pos_eci_z,        type: float64, units: m,       desc: On-board estimated position ECI Z}
      - {name: att_sigma_deg,    type: float32, units: deg,     desc: Estimator one-sigma attitude uncertainty, worst axis}
      - {name: wheel_h_x,        type: float32, units: N*m*s,   desc: Reaction wheel momentum X}
      - {name: wheel_h_y,        type: float32, units: N*m*s,   desc: Reaction wheel momentum Y}
      - {name: wheel_h_z,        type: float32, units: N*m*s,   desc: Reaction wheel momentum Z}
      - {name: dipole_cmd_x,     type: float32, units: A*m^2,   desc: Commanded magnetorquer dipole X}
      - {name: dipole_cmd_y,     type: float32, units: A*m^2,   desc: Commanded magnetorquer dipole Y}
      - {name: dipole_cmd_z,     type: float32, units: A*m^2,   desc: Commanded magnetorquer dipole Z}
      - {name: gps_valid,        type: uint8,   units: bool,    desc: GPS fix used in the last second}

  - name: EPS_HK
    sid: 3
    apid: EPS
    rate_hz: 1
    desc: Power subsystem state.
    fields:
      - {name: power_state,      type: uint8,   enum: PowerState, desc: Coarse battery state}
      - {name: batt_voltage,     type: float32, units: V,   desc: Battery bus voltage}
      - {name: batt_current,     type: float32, units: A,   desc: Battery current, positive on charge}
      - {name: batt_soc_pct,     type: float32, units: "%", desc: State of charge}
      - {name: batt_temp_c,      type: float32, units: degC, desc: Battery temperature}
      - {name: solar_power_w,    type: float32, units: W,   desc: Total array power generation}
      - {name: load_power_w,     type: float32, units: W,   desc: Total bus load}
      - {name: rails_enabled,    type: uint16,  units: mask, desc: Bitmask of enabled power rails}
      - {name: shed_level,       type: uint8,   units: level, desc: Active load-shedding level, 0 = none}

# -----------------------------------------------------------------------------
# Telecommands. Each is a PUS (service, subtype) with a typed argument list.
# -----------------------------------------------------------------------------
commands:
  - name: TEST_CONNECTION
    service: 17
    subtype: 1
    desc: ST[17,1] connection test. Flight software answers with ST[17,2].
    args: []

  - name: ENABLE_HK
    service: 3
    subtype: 5
    desc: ST[3,5] enable periodic generation of a housekeeping structure.
    args:
      - {name: sid, type: uint8, desc: Housekeeping structure identifier}

  - name: DISABLE_HK
    service: 3
    subtype: 6
    desc: ST[3,6] disable periodic generation of a housekeeping structure.
    args:
      - {name: sid, type: uint8, desc: Housekeeping structure identifier}

  - name: REPORT_PARAM
    service: 20
    subtype: 1
    desc: ST[20,1] request the value of one on-board parameter, answered by ST[20,2].
    args:
      - {name: param_id, type: uint16, desc: Parameter identifier}

  - name: SET_PARAM
    service: 20
    subtype: 3
    desc: ST[20,3] set one on-board parameter. Value is interpreted per the parameter type.
    args:
      - {name: param_id, type: uint16,  desc: Parameter identifier}
      - {name: value,    type: float64, desc: New value, converted to the parameter type}

  - name: SET_MODE
    service: 8
    subtype: 1
    desc: ST[8,1] request a spacecraft mode transition. The mode manager may refuse.
    args:
      - {name: mode, type: uint8, enum: SystemMode, desc: Requested mode}

  - name: SWITCH_RAIL
    service: 8
    subtype: 3
    desc: "ST[8,3] (mission-specific) enable or disable a power rail. The rail is on only if the ground enables it AND the power and mode policy allow it."
    args:
      - {name: rail, type: uint8, enum: PowerRail, desc: Rail to switch}
      - {name: "on", type: uint8, desc: 1 to enable, 0 to disable}

  - name: RESET_COUNTERS
    service: 8
    subtype: 2
    desc: ST[8,2] clear the housekeeping statistics counters.
    args: []

  - name: SET_TIME_REPORT_RATE
    service: 9
    subtype: 1
    desc: ST[9,1] generate a CUC time report every 2^rate_exp seconds; 255 stops them.
    args:
      - {name: rate_exp, type: uint8, desc: Report period exponent (0 = every second)}

  - name: ADJUST_TIME
    service: 9
    subtype: 128
    desc: "ST[9,128] (mission-specific) shift the on-board clock by delta_s and mark time as correlated. The ground computes delta from a time report."
    args:
      - {name: delta_s, type: float64, desc: Correction to add to on-board time, seconds}

  - name: ENABLE_SCHEDULE
    service: 11
    subtype: 1
    desc: ST[11,1] enable the release of time-tagged telecommands.
    args: []

  - name: DISABLE_SCHEDULE
    service: 11
    subtype: 2
    desc: ST[11,2] disable release; activities stay stored.
    args: []

  - name: RESET_SCHEDULE
    service: 11
    subtype: 3
    desc: ST[11,3] delete every scheduled activity.
    args: []

  - name: INSERT_ACTIVITIES
    service: 11
    subtype: 4
    desc: "ST[11,4] insert time-tagged telecommands. Data: count (u8), then per activity release time (CUC coarse u32, fine u16) and a complete telecommand packet. All-or-nothing: one bad activity rejects the request."
    variable: true
    args: []

  - name: ENABLE_STORAGE
    service: 15
    subtype: 1
    desc: ST[15,1] start recording telemetry into a packet store.
    args:
      - {name: store_id, type: uint8, desc: Packet store identifier}

  - name: DISABLE_STORAGE
    service: 15
    subtype: 2
    desc: ST[15,2] stop recording into a packet store.
    args:
      - {name: store_id, type: uint8, desc: Packet store identifier}

  - name: RETRIEVE_BY_TIME
    service: 15
    subtype: 9
    desc: ST[15,9] replay stored packets with on-board time in [from_s, to_s] on the playback virtual channel.
    args:
      - {name: store_id, type: uint8,  desc: Packet store identifier}
      - {name: from_s,   type: uint32, desc: Start of the time range (CUC coarse seconds)}
      - {name: to_s,     type: uint32, desc: End of the time range (CUC coarse seconds)}

  - name: DELETE_STORE_UP_TO
    service: 15
    subtype: 11
    desc: ST[15,11] delete stored packets older than to_s.
    args:
      - {name: store_id, type: uint8,  desc: Packet store identifier}
      - {name: to_s,     type: uint32, desc: Delete everything before this time (CUC coarse seconds)}

  - name: REPORT_STORE_SUMMARY
    service: 15
    subtype: 12
    desc: ST[15,12] request a packet store summary, answered by ST[15,13].
    args:
      - {name: store_id, type: uint8, desc: Packet store identifier}

# -----------------------------------------------------------------------------
# On-board events, downlinked as PUS ST[05] reports. Subtype = severity.
# -----------------------------------------------------------------------------
events:
  - {name: BOOT_COMPLETE,     id: 1,  severity: INFO,   desc: Flight software finished initialisation}
  - {name: MODE_CHANGED,      id: 2,  severity: INFO,   desc: "Spacecraft mode transition executed; aux = old mode << 8 | new mode"}
  - {name: LINK_CONNECTED,    id: 3,  severity: INFO,   desc: Ground link established}
  - {name: LINK_LOST,         id: 4,  severity: LOW,    desc: Ground link dropped}
  - {name: TC_REJECTED,       id: 5,  severity: LOW,    desc: Telecommand failed acceptance checks}
  - {name: HK_ENABLED,        id: 6,  severity: INFO,   desc: Housekeeping structure generation enabled}
  - {name: HK_DISABLED,       id: 7,  severity: INFO,   desc: Housekeeping structure generation disabled}
  - {name: PARAM_SET,         id: 8,  severity: INFO,   desc: On-board parameter modified from ground}
  - {name: SCHED_OVERRUN,     id: 9,  severity: MEDIUM, desc: A rate group missed its deadline}
  - {name: MODE_REFUSED,      id: 10, severity: LOW,    desc: "Requested mode transition was refused; aux = requested mode << 8 | ModeRefusal"}
  - {name: SAFE_MODE_ENTERED, id: 11, severity: HIGH,   desc: "Spacecraft entered safe mode; aux = SafeReason"}
  - {name: SENSOR_TIMEOUT,    id: 14, severity: MEDIUM, desc: No sensor data from the simulator bridge; actuators commanded to zero}
  - {name: ESTIMATOR_INIT,    id: 16, severity: INFO,   desc: "Attitude estimator initialised; aux 1 = from TRIAD, 2 = from the star tracker"}
  - {name: ESTIMATOR_CONVERGED, id: 17, severity: INFO, desc: Attitude estimator uncertainty fell below the pointing threshold}
  - {name: ESTIMATOR_RESET,   id: 19, severity: MEDIUM, desc: Attitude estimator discarded after persistent large innovations}
  - {name: TIME_ADJUSTED,     id: 20, severity: INFO,   desc: "On-board time corrected from the ground; aux = correction in ms, two's complement"}
  - {name: SCHED_RELEASED,    id: 21, severity: INFO,   desc: A time-tagged telecommand was released; aux = its packet sequence count}
  - {name: PLAYBACK_STARTED,  id: 22, severity: INFO,   desc: Packet store retrieval began; aux = packets selected}
  - {name: PLAYBACK_DONE,     id: 23, severity: INFO,   desc: Packet store retrieval finished; aux = packets replayed}
  - {name: STORE_WRAPPED,     id: 24, severity: LOW,    desc: The packet store filled and began overwriting its oldest packets}
  - {name: POWER_STATE_CHANGED, id: 25, severity: MEDIUM, desc: "Battery power state changed; aux = old << 8 | new (PowerState)"}
  - {name: LOAD_SHED,         id: 26, severity: MEDIUM, desc: "Load-shedding level changed; aux = new level (0 = everything restored)"}
  - {name: RAIL_SWITCHED,     id: 27, severity: INFO,   desc: "A power rail was switched by ground command; aux = rail << 8 | on"}
  - {name: SENSOR_RESTORED,   id: 15, severity: INFO,   desc: Sensor data resumed after a timeout}

# -----------------------------------------------------------------------------
# On-board parameters, readable and writable via PUS ST[20].
# -----------------------------------------------------------------------------
params:
  - {name: SYS_HK_PERIOD_MS,   id: 1, type: uint32,  default: 1000, min: 100,  max: 60000, units: ms,    desc: Generation period of SYS_HK}
  - {name: ADCS_HK_PERIOD_MS,  id: 2, type: uint32,  default: 1000, min: 100,  max: 60000, units: ms,    desc: Generation period of ADCS_HK}
  - {name: EPS_HK_PERIOD_MS,   id: 3, type: uint32,  default: 1000, min: 100,  max: 60000, units: ms,    desc: Generation period of EPS_HK}
  - {name: DETUMBLE_RATE_DPS,  id: 4, type: float32, default: 2.0,  min: 0.1,  max: 30.0,  units: deg/s, desc: Rate threshold above which detumble is commanded}
  - {name: POINTING_RATE_DPS,  id: 5, type: float32, default: 0.5,  min: 0.01, max: 10.0,  units: deg/s, desc: Rate threshold below which pointing is permitted}
  - {name: BATT_LOW_SOC_PCT,   id: 6, type: float32, default: 40.0, min: 5.0,  max: 90.0,  units: "%",   desc: State of charge entering the LOW power state}
  - {name: BATT_CRIT_SOC_PCT,  id: 7, type: float32, default: 20.0, min: 2.0,  max: 80.0,  units: "%",   desc: State of charge entering the CRITICAL power state}
  - {name: LINK_TIMEOUT_S,     id: 8, type: uint32,  default: 86400, min: 600, max: 604800, units: s,    desc: Time without hearing the ground before the spacecraft enters SAFE}
  - {name: BDOT_GAIN,          id: 9,  type: float32, default: 300000.0, min: 0.0, max: 10000000.0, units: "A*m^2/(T/s)", desc: B-dot proportional gain}
  - {name: MTQ_MAX_DIPOLE,     id: 10, type: float32, default: 0.2,  min: 0.0,  max: 10.0,  units: "A*m^2", desc: Largest magnetic dipole commanded on any axis}
  - {name: BDOT_FILTER_TAU_S,  id: 11, type: float32, default: 3.0,  min: 0.1,  max: 60.0,  units: s,     desc: Time constant of the filter applied to the field derivative}
  - {name: POINT_BANDWIDTH_RADPS, id: 12, type: float32, default: 0.1, min: 0.005, max: 1.0, units: rad/s, desc: Natural frequency of the pointing control loop}
  - {name: POINT_MAX_SLEW_DPS,  id: 13, type: float32, default: 1.0,  min: 0.05, max: 5.0,   units: deg/s, desc: Largest body rate the pointing controller will command while acquiring}
  - {name: MOMENTUM_DUMP_GAIN,  id: 14, type: float32, default: 0.0005, min: 0.0, max: 0.1, units: 1/s,  desc: Magnetic momentum-unloading gain}
  - {name: BATT_CAPACITY_WH,    id: 15, type: float32, default: 30.0, min: 1.0, max: 1000.0, units: W*h, desc: Usable battery energy at 100% state of charge}
